[project]
name = "rag-document-qa"
version = "0.1.0"
description = "Document Q&A RAG application with local LLMs"
requires-python = ">=3.11"

dependencies = [
    "chromadb>=1.5.9,<2.0.0",
    "langchain-text-splitters>=1.1.2,<2.0.0",
    "pypdf>=6.14.2,<7.0.0",
    "requests>=2.34.2,<3.0.0",
    "streamlit>=1.60.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.0,<1.0.0",
    "reportlab>=5.0.0,<6.0.0"

]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]